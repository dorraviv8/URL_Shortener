# Replace 'url-shortener.example.com' below with your actual domain name
# before applying this manifest to your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortener-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: url-shortener.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: url-shortener
            port:
              number: 8000
