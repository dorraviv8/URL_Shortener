apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: default
spec:
  # Replica count is intentionally omitted — it is managed by app-hpa.yaml.
  # Setting it here would cause the Deployment and HPA to fight on every apply.
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: url-shortener
          image: dorraviv/url-shortener-platform:87
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: db-secret
            - configMapRef:
                name: url-shortener-config

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5