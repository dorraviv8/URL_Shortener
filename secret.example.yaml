# IMPORTANT: This file is a template only — it contains NO real credentials.
#
# To use it:
#   1. Copy this file to k8s/secret.yaml
#   2. Replace every <REPLACE_ME> value with your actual credentials
#   3. Apply it to the cluster: kubectl apply -f k8s/secret.yaml
#
# k8s/secret.yaml is listed in .gitignore and must NEVER be committed to the repo.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: default
type: Opaque
stringData:
  POSTGRES_USER: <REPLACE_ME>
  POSTGRES_PASSWORD: <REPLACE_ME>
  POSTGRES_DB: <REPLACE_ME>
